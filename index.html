<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Documents</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="logo.svg" alt="logo">
  <h1>Online Documents</h1>
</header>

<main>
  <!-- Link ke bina aaye to -->
  <div id="home" class="card center hide">
    <img src="logo.svg" alt="">
    <h2>Online Documents</h2>
    <p style="color:var(--mute)">Please open the document link shared with you.</p>
  </div>

  <!-- Link nahi mila / delete ho gaya -->
  <div id="gone" class="card center hide">
    <h2>Link not available</h2>
    <p style="color:var(--mute)">This link is invalid or the document has been removed.</p>
  </div>

  <!-- OTP screen -->
  <div id="gate" class="card center hide">
    <img src="logo.svg" alt="">
    <h2 id="dtitle"></h2>
    <p style="color:var(--mute)">Enter the OTP you received to download this document.</p>
    <input id="otp" class="otpin" type="text" inputmode="numeric" maxlength="6" placeholder="------" autocomplete="one-time-code">
    <div class="row" style="justify-content:center;margin-top:14px">
      <button id="go" class="btn">Verify &amp; Download</button>
    </div>
    <div id="msg" class="msg"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
const $ = id => document.getElementById(id);
const code = new URLSearchParams(location.search).get('d');

function show(id){ ['home','gone','gate'].forEach(x => $(x).classList.toggle('hide', x !== id)); }
function say(t, cls){ const m = $('msg'); m.textContent = t; m.className = 'msg ' + (cls || ''); }

(async function init(){
  if(!code){ show('home'); return; }
  const { data, error } = await sb.rpc('doc_title', { p_code: code });
  if(error || !data){ show('gone'); return; }
  $('dtitle').textContent = data;
  show('gate');
})();

async function verify(){
  const otp = $('otp').value.trim();
  if(!/^\d{6}$/.test(otp)){ say('Enter the 6-digit OTP.', 'err'); return; }
  $('go').disabled = true; say('Checking...');
  const { data, error } = await sb.rpc('verify_otp', { p_code: code, p_otp: otp });
  if(error || !data || !data.length){
    $('go').disabled = false;
    say('Wrong or expired OTP. Please ask for a new OTP.', 'err');
    return;
  }
  const f = data[0];
  try{
    say('Downloading...');
    const url = sb.storage.from('docs').getPublicUrl(f.f_path).data.publicUrl;
    const res = await fetch(url);
    if(!res.ok) throw new Error('file');
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = f.f_name;
    document.body.appendChild(a); a.click(); a.remove();
    say('Download started. Thank you!', 'ok');
    $('otp').value = '';
  }catch(e){
    say('Download failed. Ask for a new OTP.', 'err');
  }
  $('go').disabled = false;
}
$('go').onclick = verify;
$('otp').addEventListener('keydown', e => { if(e.key === 'Enter') verify(); });
$('otp').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g,''); });
</script>
</body>
</html>
